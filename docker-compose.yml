version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prompt2learn-ai
    ports:
      - "5000:5000"
    volumes:
      # Mount the media directory to persist generated videos
      - ./media:/app/media
      # Mount the public directory
      - ./public:/app/public
      # Optional: mount .env file for environment variables
      - ./.env:/app/.env
    environment:
      - FLASK_APP=src/main.py
      - PYTHONUNBUFFERED=1
      # Must match the published port mapping above (5000:5000)
      - PORT=5000
    restart: unless-stopped
    networks:
      - prompt2learn-network

networks:
  prompt2learn-network:
    driver: bridge
